name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv (Python package manager)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Generate CoreML Model
        run: |
          uv sync
          # Remove existing mlpackage with stale UUID references
          rm -rf apus/Resources/Models/yolov12s.mlpackage
          # Generate .mlmodel (more reliable for CI than .mlpackage)
          uv run python scripts/convert_yolov12_to_coreml.py \
            --weights https://github.com/sunsmarterjie/yolov12/releases/download/v1.0/yolov12s.pt \
            --imgsz 640 \
            --output apus/Resources/Models/yolov12s

      - name: Verify CoreML model generated
        run: |
          ls -la apus/Resources/Models/
          if [ -d apus/Resources/Models/yolov12s.mlpackage ] || [ -f apus/Resources/Models/yolov12s.mlmodel ]; then
            echo "✓ CoreML model generated successfully"
          else
            echo "✗ CoreML model not found!"
            exit 1
          fi

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift', '**/*.h', '**/*.m') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Build and Test
        run: |
          xcodebuild \
            -project apus.xcodeproj \
            -scheme apus-ci \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES \
            -only-testing:apusTests \
            -skip-testing:apusUITests \
            clean test

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/TestResults/*.xcresult

      - name: Code Coverage Summary
        run: |
          xcrun xccov view --report --json ~/Library/Developer/Xcode/DerivedData/**/Coverage.profdata 2>/dev/null || echo "No coverage data found"
