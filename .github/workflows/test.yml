name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@9cfd02964306b527feff5fee75acfd028cce4260
        with:
          version: "0.9.26"

      - name: Generate CoreML Model
        run: |
          uv sync
          # Remove existing mlpackage with stale UUID references
          rm -rf apus/Resources/Models/yolov12s.mlpackage
          # Generate .mlmodel (more reliable for CI than .mlpackage)
          uv run python scripts/convert_yolov12_to_coreml.py \
            --weights https://github.com/sunsmarterjie/yolov12/releases/download/v1.0/yolov12s.pt \
            --imgsz 640 \
            --output apus/Resources/Models/yolov12s

      - name: Verify CoreML model generated
        run: |
          ls -la apus/Resources/Models/
          if [ -d apus/Resources/Models/yolov12s.mlpackage ] || [ -f apus/Resources/Models/yolov12s.mlmodel ]; then
            echo "✓ CoreML model generated successfully"
          else
            echo "✗ CoreML model not found!"
            exit 1
          fi

      - name: Build and Test
        run: |
          RESULT_BUNDLE="/tmp/apus-tests.xcresult"
          xcodebuild \
            -project apus.xcodeproj \
            -scheme apus-ci \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -enableCodeCoverage YES \
            -only-testing:apusTests \
            -skip-testing:apusUITests \
            -resultBundlePath "$RESULT_BUNDLE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            test

      - name: Print Test Failures
        if: failure()
        run: |
          RESULT_BUNDLE="/tmp/apus-tests.xcresult"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "No xcresult bundle found at $RESULT_BUNDLE"
            exit 0
          fi

          xcrun xcresulttool get --path "$RESULT_BUNDLE" --format json --legacy \
          | python3 - <<'PY'
          import json, sys

          raw = sys.stdin.read().strip()
          if not raw:
              print("xcresulttool produced no JSON output.")
              sys.exit(0)

          data = json.loads(raw)

          def walk(obj):
              if isinstance(obj, dict):
                  t = obj.get("_type", {})
                  if isinstance(t, dict) and t.get("_name") == "ActionTestFailureSummary":
                      test = obj.get("testCaseName", {}).get("_value")
                      msg = obj.get("message", {}).get("_value")
                      print(f"{test}: {msg}")
                  for v in obj.values():
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)

          walk(data)
          PY

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/apus-tests.xcresult

      - name: Code Coverage Summary
        run: |
          RESULT_BUNDLE="/tmp/apus-tests.xcresult"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "No xcresult bundle found at $RESULT_BUNDLE"
            exit 0
          fi
          xcrun xccov view --report --json "$RESULT_BUNDLE" 2>/dev/null || echo "No coverage data found"

      - name: Install xcresultparser
        if: always()
        run: brew install xcresultparser

      - name: Export Coverage Report
        if: always()
        run: |
          RESULT_BUNDLE="/tmp/apus-tests.xcresult"
          COVERAGE_DIR="$GITHUB_WORKSPACE/coverage"
          COVERAGE_REPORT="$COVERAGE_DIR/cobertura.xml"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "No xcresult bundle found at $RESULT_BUNDLE"
            exit 0
          fi
          if ! xcrun xccov view --report "$RESULT_BUNDLE" >/dev/null 2>&1; then
            echo "No coverage report available in $RESULT_BUNDLE"
            exit 0
          fi
          mkdir -p "$COVERAGE_DIR"
          xcresultparser --output-format cobertura --project-root "$GITHUB_WORKSPACE" "$RESULT_BUNDLE" > "$COVERAGE_REPORT"
          cp -R "$RESULT_BUNDLE" "$COVERAGE_DIR/apus-tests.xcresult"

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: coverage
          if-no-files-found: warn

  codecov:
    name: Upload Coverage to Codecov
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage results
        uses: actions/download-artifact@v4
        with:
          name: coverage-results
          path: coverage-results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-results/cobertura.xml
          disable_search: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
